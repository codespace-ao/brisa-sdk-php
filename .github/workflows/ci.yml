name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint e testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test

  integration:
    name: Integração (sandbox)
    # só corre quando o repositório tem a chave de sandbox e o endereço configurados
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    env:
      BRISA_API_KEY: ${{ secrets.BRISA_API_KEY }}
      BRISA_API_URL: ${{ vars.BRISA_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", coverage: none }
      - run: composer install --no-interaction --no-progress
      - run: composer test:integration
